name: Implement blog Mermaid

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/implement-blog-mermaid.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Patch Mermaid support
        run: python scripts/implement-blog-mermaid.py

      - name: Add Mermaid dependency
        run: |
          npm pkg set engines.node=">=22.12.0"
          npm install --save-exact --package-lock-only --lockfile-version=2 mermaid@12.0.0
          npm ci

      - name: Build website
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/implement-blog-mermaid.py
          git add scripts/sync-notion.js lib/blog.ts components/blog-mermaid.tsx \
            'app/blog/[year]/[month]/[day]/[slug]/page.tsx' \
            'app/blog/[year]/[month]/[day]/[slug]/page.module.css' \
            package.json package-lock.json .github/workflows/refresh-project-content.yml
          git commit -m "✨ feat(blog): render Mermaid diagrams"
          git push origin main
