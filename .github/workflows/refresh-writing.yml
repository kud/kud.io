name: Refresh writing

# Refresh the blog from Notion, without the project/docs sync.
# New live posts are announced in Todoist Comms by the called workflow.
# For a Comms-only test, use the existing comms-post workflow.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  checks: read

jobs:
  refresh:
    uses: ./.github/workflows/refresh-project-content.yml
    with:
      scope: writing
    secrets: inherit
