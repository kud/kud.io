name: Refresh writing

# Refresh Notion blog posts or test Todoist Comms without syncing/publishing.
on:
  workflow_dispatch:
    inputs:
      test_comms:
        description: Test pub-writing in Comms; no content sync or publishing.
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  checks: read

jobs:
  refresh:
    if: ${{ !inputs.test_comms }}
    uses: ./.github/workflows/refresh-project-content.yml
    with:
      scope: writing
    secrets: inherit

  test-comms:
    if: ${{ inputs.test_comms }}
    runs-on: ubuntu-latest
    steps:
      - name: Send writing Comms test
        uses: kud/.github/comms-thread@54f1bfdaf851d49faabd11d8f42c2c23ee087651
        with:
          token: ${{ secrets.TODOIST_MOCHI_BOT_TOKEN }}
          channel-id: ChJXTykiPdReqTDrD3k3e
          title: "✍️ Writing notifications: test only"
          content: "Mochi can post to pub-writing. This is a test; no article was published."
          notify: quiet
