name: Publish newsletter

# Notion holds the edition; this workflow only carries a Ready one to the live
# site. It syncs and validates (scripts/sync-newsletter.js), commits the
# derived files, deploys, waits until the edition is really served, then marks
# it Published in Notion and mails the teaser. It never writes or edits prose.
#
# The editor writes from 18:30 London and sets the edition Ready. The schedules
# look for it at 18:52, 19:52, 20:52 and 21:52 UTC, so at least two of them land
# after it is Ready on either side of DST. A run that finds nothing Ready stops
# after the sync, and one that finds it already Published does nothing.
#
# GitHub starts scheduled runs late, or not at all, when it is busy, and the top
# and half of the hour are its busiest minutes: on 2026-11-17 the runs meant for
# the evening before started between 01:54 and 04:06 UTC. Hence the odd minute.
# A schedule is a fallback, not a promise: a run that never starts cannot report
# itself, so a late edition is caught by whoever checks it is live.

on:
  workflow_dispatch:
    inputs:
      date:
        description: Edition date (YYYY-MM-DD). Empty = every Ready edition.
        type: string
        default: ""
      validate_only:
        description: Only parse and validate that date's edition (any status); write and publish nothing.
        type: boolean
        default: false
  schedule:
    - cron: "52 18 * * *"
    - cron: "52 19 * * *"
    - cron: "52 20 * * *"
    - cron: "52 21 * * *"

permissions:
  contents: write
  # To start deploy.yml: a GITHUB_TOKEN push triggers no workflow.
  actions: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_NEWSLETTER_DATABASE_ID: ${{ vars.NOTION_NEWSLETTER_DATABASE_ID }}
      DATE_INPUT: ${{ inputs.date }}
      REPORT: /tmp/newsletter-report.json
      # Only whether the secret exists: `if:` cannot read secrets directly.
      HAS_TODOIST_MOCHI_BOT_TOKEN: ${{ secrets.TODOIST_MOCHI_BOT_TOKEN != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The sync script imports TypeScript from lib/ through Node's own type
      # stripping, which needs Node 22.18 or later; lts/* is newer.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A dry check of one edition, Draft included: parse, validate, report.
      - name: Validate only
        if: inputs.validate_only
        run: node scripts/sync-newsletter.js --validate-only "--date=$DATE_INPUT"

      # Writes the files, the report, and this step's outputs: `publish`
      # (valid editions not yet Published) and `invalid`, space-separated dates.
      - name: Sync from Notion
        id: plan
        if: ${{ !inputs.validate_only }}
        run: |
          node scripts/sync-newsletter.js ${DATE_INPUT:+"--date=$DATE_INPUT"} "--report=$REPORT"
          if [ -n "$(git status --porcelain -- content/newsletter)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # An invalid edition never reaches the site; the editor sees why in
      # Notion's Error property and the job fails at the end.
      - name: Mark invalid editions failed
        if: steps.plan.outputs.invalid != ''
        run: |
          for date in ${{ steps.plan.outputs.invalid }}; do
            node scripts/sync-newsletter.js --mark=failed "--date=$date" "--from-report=$REPORT"
          done

      # Nothing outside content/newsletter/ may ride along in the commit.
      - name: Guard the working tree
        if: steps.plan.outputs.changed == 'true'
        run: |
          stray=$(git status --porcelain --untracked-files=all | grep -v ' content/newsletter/' || true)
          if [ -n "$stray" ]; then
            echo "Files changed outside content/newsletter/:"
            echo "$stray"
            exit 1
          fi

      - name: Build website
        if: steps.plan.outputs.changed == 'true'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -q 'releases-unavailable:' "$RUNNER_TEMP/build.log"
          then
            echo "::warning title=Release data unavailable::GitHub served no release data to this check build. The content built, and the deploy reads releases again with its own token."
          fi
        env:
          # The same token the deploy builds with: unauthenticated, /projects
          # gets 60 GitHub requests an hour and needs a few hundred.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nothing this build renders ships, so a GitHub outage downgrades the
          # release column to a warning here instead of holding back content.
          RELEASES_BEST_EFFORT: "1"

      - name: Commit and push
        if: steps.plan.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/newsletter
          git commit -m "📝 docs(newsletter): publish ${{ steps.plan.outputs.publish }}"
          # Humans, agents and the hourly refresh push here too: rebase onto
          # whatever landed since checkout, then retry.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done

      # Also when nothing changed: a Ready edition already committed by a run
      # whose deploy failed still needs one.
      - name: Deploy
        if: steps.plan.outputs.publish != ''
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Live means the production page answers 200 and names this edition. The
      # deploy builds on a fresh runner, so allow it twenty minutes.
      - name: Wait for the editions to go live
        if: steps.plan.outputs.publish != ''
        run: |
          for date in ${{ steps.plan.outputs.publish }}; do
            deadline=$(( $(date +%s) + 1200 ))
            until curl -fsS --max-time 20 "https://kud.io/newsletter/${date//-//}" 2>/dev/null | grep -q "data-edition=\"$date\""; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "$date is not live after 20 minutes"
                exit 1
              fi
              sleep 30
            done
            echo "$date is live"
          done

      - name: Mark published
        if: steps.plan.outputs.publish != ''
        run: |
          for date in ${{ steps.plan.outputs.publish }}; do
            node scripts/sync-newsletter.js --mark=published "--date=$date"
          done

      # The same announcement as a Todoist Comms thread in pub-newsletter. One
      # thread per run (a run nearly always publishes a single edition). Skipped
      # without TODOIST_MOCHI_BOT_TOKEN, and never fails the publication.
      - name: Prepare the Comms announcement
        id: comms_newsletter
        if: steps.plan.outputs.publish != '' && env.HAS_TODOIST_MOCHI_BOT_TOKEN == 'true'
        continue-on-error: true
        env:
          DATES: ${{ steps.plan.outputs.publish }}
        run: |
          set -euo pipefail
          shopt -s inherit_errexit
          read -ra dates <<<"$DATES"
          body=""
          for date in "${dates[@]}"; do
            file="content/newsletter/$date/edition.json"
            lead=$(jq -r '.items[0].title.fr // empty' "$file")
            count=$(jq -r '.items | length' "$file")
            minutes=$(jq -r '.readingMinutes.fr // empty' "$file")
            day=$(node -e 'process.stdout.write(new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" }).format(new Date(`${process.argv[1]}T00:00:00Z`)))' "$date")
            title=$(printf '📰 Newsletter du %s publiée' "$day")
            entry=$(printf '%s sujets%s\n\n%s\n\n[Lire l’édition](https://kud.io/newsletter/%s?lang=fr)' \
              "$count" "${minutes:+ · $minutes min}" "$lead" "${date//-//}")
            if (( ${#dates[@]} > 1 )); then
              entry=$(printf '**%s**\n%s' "$title" "$entry")
            fi
            body+="${body:+$'\n\n'}$entry"
          done
          if (( ${#dates[@]} > 1 )); then
            title="📰 ${#dates[@]} newsletters publiées"
          fi
          { echo "title=$title"; echo "content<<COMMS_EOF"; printf '%s\n' "$body"; echo "COMMS_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Announce in Comms
        id: comms_announce
        if: steps.comms_newsletter.outcome == 'success'
        continue-on-error: true
        uses: kud/.github/comms-thread@54f1bfdaf851d49faabd11d8f42c2c23ee087651
        with:
          token: ${{ secrets.TODOIST_MOCHI_BOT_TOKEN }}
          channel-id: ChJXTwsrDQncsNTd2p2Pk
          title: ${{ steps.comms_newsletter.outputs.title }}
          content: ${{ steps.comms_newsletter.outputs.content }}

      # continue-on-error turns the failure into success, so this step reads outcome
      - name: Warn if the Comms announcement failed
        if: steps.comms_newsletter.outcome == 'failure' || steps.comms_announce.outcome == 'failure'
        run: echo "::warning title=Comms announcement failed::The newsletter was published but its pub-newsletter thread was not posted. Check TODOIST_MOCHI_BOT_TOKEN and the step log."

      # After Published, never before: the script refuses any other status and
      # skips a language already sent, so a re-run never mails twice. Without
      # the email secrets it says so and succeeds.
      - name: Send the teaser
        if: steps.plan.outputs.publish != ''
        run: |
          for date in ${{ steps.plan.outputs.publish }}; do
            node scripts/sync-newsletter.js --notify "--date=$date"
          done
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_SEGMENT_FR: ${{ vars.RESEND_SEGMENT_FR }}
          RESEND_SEGMENT_EN: ${{ vars.RESEND_SEGMENT_EN }}
          NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM }}
          NEWSLETTER_SIGNING_SECRET: ${{ secrets.NEWSLETTER_SIGNING_SECRET }}

      # Any failure before Published lands on the edition in Notion. The mark
      # refuses to touch an edition already Published, so a failed email
      # leaves a live edition alone.
      - name: Record the failure in Notion
        if: failure() && steps.plan.outputs.publish != ''
        run: |
          for date in ${{ steps.plan.outputs.publish }}; do
            node scripts/sync-newsletter.js --mark=failed "--date=$date" \
              "--error=Publication failed in run ${GITHUB_RUN_ID}; see the Actions log." || true
          done

      - name: Fail on invalid editions
        if: steps.plan.outputs.invalid != ''
        run: |
          echo "Invalid editions: ${{ steps.plan.outputs.invalid }} (reasons in Notion's Error property)"
          exit 1

  # A failed or warning-laden publication run lands in the alerts channel too.
  notify:
    needs: publish
    if: ${{ always() }}
    permissions:
      actions: read
      checks: read
    uses: ./.github/workflows/notify-comms.yml
    secrets: inherit
