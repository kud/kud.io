name: Deploy to Vercel

# Builds on GitHub's runner and uploads the result to Vercel production, so a
# deploy never waits on Vercel's own build queue or its daily build limit.
# Vercel's git integration stays on for preview branches only (vercel.json).

on:
  push:
    branches: [main]
  # The hourly content refresh pushes with GITHUB_TOKEN, which never triggers
  # `push`; it dispatches this workflow instead when it committed something.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel production settings
        run: npx --yes vercel@65.14.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes vercel@65.14.0 build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: npx --yes vercel@65.14.0 deploy --prebuilt --prod --archive=tgz --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
