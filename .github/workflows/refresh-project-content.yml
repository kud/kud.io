name: Refresh website

on:
  workflow_dispatch:
  repository_dispatch:
    types: [project-content-updated]
  schedule:
    - cron: "17 * * * *"
  # The narrower refresh-*.yml workflows call this one with a scope, so they all
  # share one set of build, commit and deploy steps.
  workflow_call:
    inputs:
      scope:
        description: website (everything), docs or writing
        type: string
        default: website
      projects:
        description: docs scope, comma-separated repo names (empty = all)
        type: string
        default: ""
      articles:
        description: writing scope, comma-separated slugs or titles
        type: string
        default: ""
      latest_articles:
        description: writing scope, the N newest posts (0 = all)
        type: string
        default: "0"

permissions:
  contents: write
  # To start the production deploy after a refresh commit.
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-project-content
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync project content
        run: |
          case "${SCOPE:-website}" in
            docs)
              node scripts/sync-content.js ${PROJECTS:+"--only=$PROJECTS"} ;;
            writing)
              if [ -n "$ARTICLES" ]; then
                node scripts/sync-notion.js "--slug=$ARTICLES"
              elif [ "${LATEST:-0}" -gt 0 ]; then
                node scripts/sync-notion.js "--latest=$LATEST"
              else
                node scripts/sync-notion.js
              fi ;;
            *)
              npm run sync ;;
          esac
        env:
          SCOPE: ${{ inputs.scope }}
          PROJECTS: ${{ inputs.projects }}
          ARTICLES: ${{ inputs.articles }}
          LATEST: ${{ inputs.latest_articles }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BLOG_DATABASE_ID: ${{ vars.NOTION_BLOG_DATABASE_ID }}

      - name: Check for content changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- content/projects content/readmes content/landings content/blog content/blog-redirects.json public/blog)" ]; then
            echo "No project content changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Guards main against content that would break the deploy; the hourly
      # runs that changed nothing have nothing to guard.
      - name: Build website
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit refreshed content
        id: commit
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/projects content/readmes content/landings content/blog content/blog-redirects.json public/blog
          # Posts that did not exist on main before this run: the ones worth announcing.
          new_posts=$(git diff --cached --name-only --diff-filter=A -- 'content/blog/*.md' | xargs -r -n1 basename | sed 's/\.md$//' | tr '\n' ' ')
          echo "new_posts=${new_posts% }" >> "$GITHUB_OUTPUT"
          git commit -m "📝 docs(content): refresh project content"
          # Humans and agents push to this branch too, so a bare push races the
          # hourly run and rejects. Rebase onto whatever landed since checkout.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
          # A GITHUB_TOKEN push triggers no workflow, so start the deploy here.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # One line in the writing channel per new post, once its page is really
      # served. Edits to existing posts announce nothing. Best effort: a slow
      # deploy or a Slack hiccup never fails the refresh.
      - name: Announce new posts
        if: steps.commit.outputs.new_posts != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WRITING_WEBHOOK_URL }}
        run: |
          [ -n "$SLACK_WEBHOOK_URL" ] || { echo "No writing webhook; skipping."; exit 0; }
          for slug in ${{ steps.commit.outputs.new_posts }}; do
            file="content/blog/$slug.md"
            title=$(sed -n 's/^title: "\(.*\)"$/\1/p' "$file" | head -1)
            description=$(sed -n 's/^description: "\(.*\)"$/\1/p' "$file" | head -1)
            date=$(sed -n 's/^date: "\(.*\)"$/\1/p' "$file" | head -1)
            url="https://kud.io/blog/${date//-//}/$slug"
            deadline=$(( $(date +%s) + 1200 ))
            until curl -fsS -o /dev/null --max-time 20 "$url" 2>/dev/null; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "$slug is not live after 20 minutes; not announcing"
                continue 2
              fi
              sleep 30
            done
            text=$(printf '✍️ *%s*\n%s\n<%s|Read it>' "$title" "$description" "$url")
            jq -n --arg text "$text" '{text: $text}' \
              | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL" \
              || echo "Slack announcement failed for $slug"
          done
