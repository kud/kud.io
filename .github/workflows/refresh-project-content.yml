name: Refresh website

on:
  workflow_dispatch:
  repository_dispatch:
    types: [project-content-updated]
  schedule:
    - cron: "17 * * * *"
  # The narrower refresh-*.yml workflows call this one with a scope, so they all
  # share one set of build, commit and deploy steps.
  workflow_call:
    inputs:
      scope:
        description: website (everything), docs or writing
        type: string
        default: website
      projects:
        description: docs scope, comma-separated repo names (empty = all)
        type: string
        default: ""
      articles:
        description: writing scope, comma-separated slugs or titles
        type: string
        default: ""
      latest_articles:
        description: writing scope, the N newest posts (0 = all)
        type: string
        default: "0"

permissions:
  contents: write
  # To start the production deploy after a refresh commit.
  actions: write
  # For the failure notifier, which reads this run's jobs and annotations.
  checks: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Only whether the secret exists: `if:` cannot read secrets directly.
      HAS_TODOIST_MOCHI_BOT_TOKEN: ${{ secrets.TODOIST_MOCHI_BOT_TOKEN != '' }}
    concurrency:
      group: refresh-project-content
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync project content
        run: |
          case "${SCOPE:-website}" in
            docs)
              node scripts/sync-content.js ${PROJECTS:+"--only=$PROJECTS"} ;;
            writing)
              if [ -n "$ARTICLES" ]; then
                node scripts/sync-notion.js "--slug=$ARTICLES"
              elif [ "${LATEST:-0}" -gt 0 ]; then
                node scripts/sync-notion.js "--latest=$LATEST"
              else
                node scripts/sync-notion.js
              fi ;;
            *)
              npm run sync ;;
          esac
        env:
          SCOPE: ${{ inputs.scope }}
          PROJECTS: ${{ inputs.projects }}
          ARTICLES: ${{ inputs.articles }}
          LATEST: ${{ inputs.latest_articles }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BLOG_DATABASE_ID: ${{ vars.NOTION_BLOG_DATABASE_ID }}

      - name: Check for content changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- content/projects content/readmes content/landings content/blog content/blog-redirects.json public/blog)" ]; then
            echo "No project content changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Guards main against content that would break the deploy; the hourly
      # runs that changed nothing have nothing to guard.
      - name: Build website
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/build.log"
          if grep -q 'releases-unavailable:' "$RUNNER_TEMP/build.log"
          then
            echo "::warning title=Release data unavailable::GitHub served no release data to this check build. The content built, and the deploy reads releases again with its own token."
          fi
        env:
          # The same token the deploy builds with: unauthenticated, /projects
          # gets 60 GitHub requests an hour and needs a few hundred.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Nothing this build renders ships, so a GitHub outage downgrades the
          # release column to a warning here instead of holding back content.
          RELEASES_BEST_EFFORT: "1"

      - name: Commit refreshed content
        id: commit
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/projects content/readmes content/landings content/blog content/blog-redirects.json public/blog
          # Posts that did not exist on main before this run: the ones worth announcing.
          new_posts=$(git diff --cached --name-only --diff-filter=A -- 'content/blog/*.md' | xargs -r -n1 basename | sed 's/\.md$//' | tr '\n' ' ')
          echo "new_posts=${new_posts% }" >> "$GITHUB_OUTPUT"
          git commit -m "📝 docs(content): refresh project content"
          # Humans and agents push to this branch too, so a bare push races the
          # hourly run and rejects. Rebase onto whatever landed since checkout.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
          # A GITHUB_TOKEN push triggers no workflow, so start the deploy here.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Comms is the sole writing-announcement channel. The normal
      # preparation step waits for the public article to become reachable.
      - name: Warn if writing Comms is not configured
        if: steps.commit.outputs.new_posts != '' && env.HAS_TODOIST_MOCHI_BOT_TOKEN != 'true'
        run: echo "::warning title=Writing Comms token missing::Articles were synced but not announced in pub-writing."

      - name: Prepare the Comms announcement
        id: comms_writing
        if: steps.commit.outputs.new_posts != '' && env.HAS_TODOIST_MOCHI_BOT_TOKEN == 'true'
        continue-on-error: true
        env:
          NEW_POSTS: ${{ steps.commit.outputs.new_posts }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1200 ))
          count=0
          body=""
          for slug in $NEW_POSTS; do
            file="content/blog/$slug.md"
            title=$(sed -n 's/^title: "\(.*\)"$/\1/p' "$file" | head -1)
            description=$(sed -n 's/^description: "\(.*\)"$/\1/p' "$file" | head -1)
            date=$(sed -n 's/^date: "\(.*\)"$/\1/p' "$file" | head -1)
            url="https://kud.io/blog/${date//-//}/$slug"
            until curl -fsS -o /dev/null --max-time 20 "$url" 2>/dev/null; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "$url is not live; not announced in Comms."
                continue 2
              fi
              sleep 30
            done
            count=$((count + 1))
            first_title=$title
            entry=$(printf '%s\n\n[Read it](%s)' "$description" "$url")
            single=$entry
            body+="${body:+$'\n\n'}$(printf '**%s**\n%s' "$title" "$entry")"
          done
          if (( count == 0 )); then
            echo "No new post is live; nothing to announce."
            exit 0
          fi
          if (( count == 1 )); then
            title="✍️ $first_title"
            body=$single
          else
            title="✍️ $count new posts"
          fi
          { echo "title=$title"; echo "content<<COMMS_EOF"; printf '%s\n' "$body"; echo "COMMS_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Announce new posts in Comms
        if: steps.comms_writing.outcome == 'success' && steps.comms_writing.outputs.title != ''
        continue-on-error: true
        uses: kud/.github/comms-thread@54f1bfdaf851d49faabd11d8f42c2c23ee087651
        with:
          token: ${{ secrets.TODOIST_MOCHI_BOT_TOKEN }}
          channel-id: ChJXTykiPdReqTDrD3k3e
          title: ${{ steps.comms_writing.outputs.title }}
          content: ${{ steps.comms_writing.outputs.content }}

  # A failed refresh lands in the alerts channel. It runs every hour, so only a
  # change is reported: the first failure, and the run that recovers.
  notify:
    needs: refresh
    if: always()
    permissions:
      actions: read
      checks: read
    uses: ./.github/workflows/notify-comms.yml
    with:
      on_change_only: true
    secrets: inherit
