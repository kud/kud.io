name: Refresh website

on:
  workflow_dispatch:
  repository_dispatch:
    types: [project-content-updated]
  schedule:
    - cron: "17 * * * *"
  # The narrower refresh-*.yml workflows call this one with a scope, so they all
  # share one set of build, commit and deploy steps.
  workflow_call:
    inputs:
      scope:
        description: website (everything), docs or writing
        type: string
        default: website
      projects:
        description: docs scope, comma-separated repo names (empty = all)
        type: string
        default: ""
      articles:
        description: writing scope, comma-separated slugs or titles
        type: string
        default: ""
      latest_articles:
        description: writing scope, the N newest posts (0 = all)
        type: string
        default: "0"

permissions:
  contents: write
  # To start the production deploy after a refresh commit.
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-project-content
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync project content
        run: |
          case "${SCOPE:-website}" in
            docs)
              node scripts/sync-content.js ${PROJECTS:+"--only=$PROJECTS"} ;;
            writing)
              if [ -n "$ARTICLES" ]; then
                node scripts/sync-notion.js "--slug=$ARTICLES"
              elif [ "${LATEST:-0}" -gt 0 ]; then
                node scripts/sync-notion.js "--latest=$LATEST"
              else
                node scripts/sync-notion.js
              fi ;;
            *)
              npm run sync ;;
          esac
        env:
          SCOPE: ${{ inputs.scope }}
          PROJECTS: ${{ inputs.projects }}
          ARTICLES: ${{ inputs.articles }}
          LATEST: ${{ inputs.latest_articles }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_BLOG_DATABASE_ID: ${{ vars.NOTION_BLOG_DATABASE_ID }}

      - name: Check for content changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- content/projects content/readmes content/landings content/blog content/blog-redirects.json public/blog)" ]; then
            echo "No project content changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Guards main against content that would break the deploy; the hourly
      # runs that changed nothing have nothing to guard.
      - name: Build website
        if: steps.changes.outputs.changed == 'true'
        run: npm run build

      - name: Commit refreshed content
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/projects content/readmes content/landings content/blog content/blog-redirects.json public/blog
          git commit -m "📝 docs(content): refresh project content"
          # Humans and agents push to this branch too, so a bare push races the
          # hourly run and rejects. Rebase onto whatever landed since checkout.
          for attempt in 1 2 3 4 5; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
          done
          # A GITHUB_TOKEN push triggers no workflow, so start the deploy here.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
